<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – Hexagon</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    body {
      background: #404040;
      color: #f0f0f0;
      font-family: Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #505050;
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; }
    input[type=password] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem 0.6rem;
      border-radius: 4px;
      border: 1px solid #888;
      background: #606060;
      color: #f0f0f0;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: 0.6rem;
      background: #5070b0;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #6080c0; }
    button:disabled { opacity: 0.6; cursor: default; }
    #msg { margin-top: 1rem; font-size: 0.9rem; line-height: 1.4; }
    .err { color: #f08080; }
    .ok  { color: #80d080; }
    a { color: #80b0f0; }
  </style>
</head>
<body>
<div class="card">
  <h1>Reset your password</h1>
  <div id="content"></div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token') || '';
  const content = document.getElementById('content');

  if (!token) {
    content.innerHTML = '<p class="err">Invalid or missing reset link. Please request a new password reset from the app.</p>';
  } else {
    content.innerHTML = `
      <label for="pw">New password (min. 8 characters)</label>
      <input type="password" id="pw" minlength="8" required autofocus>
      <button id="btn" onclick="submit()">Set new password</button>
      <div id="msg"></div>
    `;
    document.getElementById('pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') submit();
    });
  }

  const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const backendUrl = isLocal
    ? 'http://localhost:3000'
    : 'https://hexagon-game-a0w8.onrender.com';

  async function submit() {
    const pw = document.getElementById('pw').value;
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    if (pw.length < 8) {
      msg.className = 'err';
      msg.textContent = 'Password must be at least 8 characters.';
      return;
    }
    btn.disabled = true;
    msg.className = '';
    msg.textContent = '';
    try {
      const body = new URLSearchParams({ token, password: pw });
      const res = await fetch(`${backendUrl}/user_login/password_reset`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString(),
        credentials: 'include',
      });
      if (res.ok) {
        msg.className = 'ok';
        msg.textContent = 'Password updated! You can now log in with your new password.';
        document.getElementById('pw').disabled = true;
      } else {
        const text = await res.text();
        msg.className = 'err';
        msg.textContent = text || `Error ${res.status}. The link may have expired.`;
        btn.disabled = false;
      }
    } catch (e) {
      msg.className = 'err';
      msg.textContent = 'Network error. Please try again.';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
