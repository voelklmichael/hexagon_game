[workspace]
members = ["hexagon_engine", "hexagon_egui"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
derive_aliases = "0.4"
strum = { version = "0.28", features = ["derive"] }
svg = "*"
tracing = "0.1.44"

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
