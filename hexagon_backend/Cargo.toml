[package]
name = "hexagon_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
hexagon_db = { path = "../hexagon_db" }
hexagon_types = { path = "../hexagon_types" }
figment.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
thiserror.workspace = true

axum = "0.8"
axum-login = "0.18.0"
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
tower-http = { version = "0.6", features = ["cors"] }
axum-messages = "0.8.0"
password-auth = "1.0.0"
argon2 = "0.5.3"
secrecy.workspace = true
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"], default-features = false }
tokio-util.workspace = true
